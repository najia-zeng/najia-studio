<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能体 · 提示词生成器</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #ffffff;
            --card: #ffffff;
            --border: #e7e7f0;
            --text: #1b1b2f;
            --text-sec: #7b7b93;
            --text-tri: #c3c3d4;
            --field-bg: #fafaff;
            --prompt-bg: #f7f5ff;
            --accent: #6b5ce7;
            --accent-h: #5a4bd6;
            --accent-2: #4a7cf7;
            --grad: linear-gradient(135deg, #6b5ce7 0%, #4a7cf7 100%);
            --radius: 20px;
            --radius-s: 12px;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .outer {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 48px;
        }

        /* ===== Header ===== */
        .hdr {
            height: 92px;
            background: linear-gradient(100deg, #ffffff 0%, #fbfaff 42%, #f2efff 100%);
            border-bottom: 1px solid var(--border);
            position: relative;
            display: flex;
            align-items: center;
        }
        .hdr::after {
            content: '';
            position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
            background: var(--grad); opacity: .5;
        }
        .hdr-in {
            width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 48px;
            display: flex; align-items: center; justify-content: space-between; gap: 20px;
        }
        .hdr-l { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
        .hdr-title {
            font-size: 27px; font-weight: 750; letter-spacing: -.6px; line-height: 1.12;
            background: var(--grad);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .hdr-sub { font-size: 13px; color: var(--text-sec); letter-spacing: .2px; font-weight: 400; }
        .hdr-tag {
            flex-shrink: 0; display: flex; align-items: center; gap: 7px;
            font-size: 12.5px; color: #6b5ce7; background: rgba(107,92,231,.08);
            border: 1px solid rgba(107,92,231,.18); border-radius: 999px;
            padding: 7px 15px; font-weight: 500;
        }
        .hdr-tag i { width: 6px; height: 6px; border-radius: 50%; background: var(--grad); display: block; }
        @media (max-width: 720px) {
            .hdr { height: auto; padding: 14px 0; }
            .hdr-in { padding: 0 18px; }
            .hdr-title { font-size: 21px; }
            .hdr-tag { display: none; }
        }

        /* ===== Layout ===== */
        .wrap {
            display: flex;
            gap: 40px;
            padding: 32px 0 48px;
            min-height: calc(100vh - 158px);
        }

        /* ===== Left ===== */
        .left {
            width: 340px;
            min-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 侧栏底部「体验额度 / 解锁」按钮（吸底） */
        .side-quota { margin-top: auto; padding-top: 4px; text-align: center; }
        .side-quota .quota-tag { display: block; text-align: center; }
        .side-quota .quota-cta { width: 100%; padding: 10px 12px; white-space: normal; line-height: 1.5; }

        .sec-title { font-size: 20px; font-weight: 600; letter-spacing: -0.2px; margin-bottom: 10px; }

        /* Mode cards */
        .m-card {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 20px;
            cursor: pointer;
            transition: all .2s;
            background: var(--bg);
        }
        .m-card:hover { border-color: #b8b8bf; }
        .m-card.on { border-color: var(--text); }
        .m-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
        .m-label { font-size: 11px; font-weight: 500; color: var(--text-sec); letter-spacing: 0.5px; }
        .m-name { font-size: 14px; font-weight: 600; }
        .m-desc { font-size: 12px; color: var(--text-sec); line-height: 1.5; }

        /* Upload */
        .up-area {
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            padding: 32px 16px;
            text-align: center;
            cursor: pointer;
            transition: all .2s;
            background: var(--field-bg);
            min-height: 120px;
            display: flex; align-items: center; justify-content: center;
        }
        .up-area:hover { border-color: var(--text-sec); background: #f3f3f6; }
        .up-area.has { border-style: solid; border-color: var(--border); padding: 10px; background: var(--bg); }
        .up-ico { font-size: 20px; color: var(--text-tri); margin-bottom: 8px; }
        .up-txt { font-size: 13px; color: var(--text-sec); }
        .up-hint { font-size: 11px; color: var(--text-tri); margin-top: 4px; }
        .up-prev { max-width: 100%; max-height: 180px; border-radius: 8px; object-fit: contain; }
        .up-rm {
            position: absolute; top: 8px; right: 8px;
            width: 22px; height: 22px;
            background: rgba(0,0,0,.3); color: #fff;
            border: none; border-radius: 50%;
            cursor: pointer; font-size: 13px;
            display: flex; align-items: center; justify-content: center;
        }
        .up-rm:hover { background: rgba(0,0,0,.55); }

        .field-label { font-size: 13px; font-weight: 500; color: var(--text-sec); margin-bottom: 8px; display: block; }
        .inp-textarea {
            width: 100%; padding: 10px 14px;
            border: 1px solid var(--border); border-radius: var(--radius-s);
            font-size: 13px; font-family: inherit;
            resize: vertical; min-height: 48px;
            background: var(--field-bg);
            transition: border-color .2s;
        }
        .inp-textarea:focus { outline: none; border-color: var(--accent); background: var(--bg); box-shadow: 0 0 0 3px rgba(107,92,231,.12); }
        .inp-textarea::placeholder { color: var(--text-tri); }

        /* Generate button */
        .gen-btn {
            width: 100%; padding: 13px;
            background: var(--grad); color: #fff;
            border: none; border-radius: var(--radius-s);
            font-size: 14px; font-weight: 500;
            cursor: pointer; font-family: inherit;
            transition: all .2s;
            margin-top: 2px;
            box-shadow: 0 6px 18px rgba(107,92,231,.28);
        }
        .gen-btn:hover { box-shadow: 0 9px 26px rgba(107,92,231,.4); transform: translateY(-1px); }
        .gen-btn:active { transform: scale(.98); }
        .gen-btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }

        /* ===== Right ===== */
        .right {
            flex: 1;
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }

        .right-inner {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
        }

        .right-top {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
        }
        .right-title { font-size: 14px; font-weight: 600; }
        .right-actions { display: flex; gap: 8px; }
        .act-btn {
            padding: 5px 14px; background: var(--bg);
            border: 1px solid var(--border); border-radius: 8px;
            font-size: 12px; cursor: pointer; font-family: inherit;
            color: var(--text-sec); transition: all .15s;
        }
        .act-btn:hover { border-color: var(--accent); color: var(--accent); }

        .right-body {
            flex: 1; overflow-y: auto; padding: 28px;
        }
        .right-body::-webkit-scrollbar { width: 4px; }
        .right-body::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

        /* Empty state */
        .empty {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start;
            padding-top: 15vh;
            text-align: center; color: var(--text-tri);
        }
        .empty-ico { font-size: 48px; margin-bottom: 16px; opacity: .5; }
        .empty-t { font-size: 16px; font-weight: 600; color: var(--text-sec); margin-bottom: 6px; }
        .empty-d { font-size: 13px; color: var(--text-tri); max-width: 300px; line-height: 1.7; }

        /* Loading */
        .ldg { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spin { width: 32px; height: 32px; border: 2px solid var(--border); border-top-color: var(--text); border-radius: 50%; animation: sp .8s linear infinite; }
        @keyframes sp { to { transform: rotate(360deg); } }
        .ldg-txt { margin-top: 16px; font-size: 13px; color: var(--text-sec); }

        /* Result */
        .res-wrap { max-width: 100%; }

        /* ===== Prompt card (light bg, individual copy) ===== */
        .prompt-card {
            background: var(--prompt-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-s);
            padding: 20px;
            margin: 16px 0;
            position: relative;
        }
        .prompt-card-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text);
        }
        .prompt-card-body {
            font-size: 13px;
            line-height: 1.85;
            color: #333;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .prompt-copy {
            position: absolute;
            top: 14px;
            right: 14px;
            padding: 4px 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
            color: var(--text-sec);
            transition: all .15s;
        }
        .prompt-copy:hover { border-color: var(--accent); color: var(--accent); }

        /* Markdown (for analysis text) */
        .md-body { line-height: 1.85; font-size: 13.5px; color: #333; }
        .md-body h2 { font-size: 16px; font-weight: 700; margin: 28px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); color: var(--text); }
        .md-body h3 { font-size: 14px; font-weight: 600; margin: 20px 0 8px; color: var(--text); }
        .md-body p { margin-bottom: 12px; }
        .md-body strong { color: var(--text); font-weight: 600; }
        .md-body ul, .md-body ol { padding-left: 18px; margin-bottom: 12px; }
        .md-body li { margin-bottom: 3px; }
        .md-body hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
        .md-body blockquote { border-left: 2px solid var(--text-tri); padding-left: 14px; color: var(--text-sec); margin: 12px 0; }
        .md-body code { background: var(--field-bg); padding: 2px 6px; border-radius: 4px; font-size: 12.5px; }
        .md-body pre { display: none; }

        /* Error */
        .err { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .err-ico { font-size: 40px; margin-bottom: 12px; opacity: .5; }
        .err-t { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
        .err-d { font-size: 13px; color: var(--text-sec); max-width: 320px; line-height: 1.7; }
        .retry-btn { margin-top: 16px; padding: 9px 26px; background: var(--grad); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit; box-shadow: 0 5px 14px rgba(107,92,231,.24); }

        /* Responsive */
        @media (max-width: 860px) {
            .outer { padding: 0 20px; }
            .wrap { flex-direction: column; gap: 24px; }
            .left { width: 100%; min-width: 0; }
            .right { min-height: 400px; }
        }

    /* ===== 体验额度 & 买断弹窗 ===== */
    .quota-tag { font-size: 12px; color: #999; white-space: nowrap; }
    .quota-tag b { font-weight: 500; color: #555; }
    .quota-tag.used { color: #d9534f; }
    .nj-dlg-mask { position: fixed; inset: 0; background: rgba(0,0,0,.38); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
    .nj-dlg { background: #fff; border-radius: 14px; width: 100%; max-width: 420px; max-height: 88vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.2); position: relative; }
    .nj-dlg-b { padding: 34px 26px 4px; }
    .nj-dlg-t1 { font-size: 23px; font-weight: 700; color: #1a1a2e; text-align: center; letter-spacing: 1.5px; }
    .nj-dlg-t2 { font-size: 13px; color: #6a6483; text-align: center; margin: 11px 0 22px; line-height: 1.65; }
    .nj-dlg-x { position: absolute; right: 15px; top: 11px; color: #c9c9d6; font-size: 22px; line-height: 1; cursor: pointer; z-index: 3; background: none; border: none; font-family: inherit; padding: 4px; }
    .nj-dlg-x:hover { color: #888; }
    .nj-qr-box { display: block; border: 1px dashed #d9d9e6; border-radius: 16px; background: #fafafd; padding: 22px 18px 15px; }
    .nj-qr-box img { display: block; width: 180px; height: 180px; object-fit: contain; border-radius: 10px; background: #fff; margin: 0 auto; }
    .nj-qr-tip { font-size: 13px; color: #9c9cb2; text-align: center; margin-top: 13px; }
    .nj-qr-or { font-size: 13px; color: #8d8da3; text-align: center; margin: 20px 0 11px; }
    .nj-qr-id { text-align: center; font-size: 19px; font-weight: 700; letter-spacing: 1.2px; color: #6b5ce7; background: #f4f2fd; border-radius: 10px; padding: 11px; cursor: pointer; user-select: all; transition: background .15s, color .15s; }
    .nj-qr-id:hover { background: #ebe7fb; }
    .nj-qr-id.copied { background: #e9f8ee; color: #2f9e57; }
    .nj-lic-mini { font-size: 11.5px; color: #bcbccb; text-align: center; margin: 20px 0 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
    .nj-lic-mini:hover { color: #6b5ce7; }
    .nj-lic-row { display: flex; gap: 8px; }
    .nj-lic-row input { flex: 1; min-width: 0; box-sizing: border-box; padding: 10px 12px; border: 1px solid #e8e8ed; border-radius: 8px; font-size: 13px; font-family: inherit; color: #1a1a2e; }
    .nj-lic-row input:focus { outline: none; border-color: #999; }
    .nj-lic-row button { padding: 0 17px; border-radius: 8px; border: 1px solid #6b5ce7; background: #fff; color: #6b5ce7; font-size: 13px; cursor: pointer; font-family: inherit; white-space: nowrap; }
    .nj-lic-err { font-size: 12px; color: #d9534f; min-height: 18px; padding-top: 6px; }
    .nj-dlg-f { padding: 14px 26px 26px; }
    .nj-dlg-f button { width: 100%; padding: 13px; border-radius: 9px; border: none; background: linear-gradient(135deg,#6b5ce7 0%,#4a7cf7 100%); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; box-shadow: 0 4px 12px rgba(107,92,231,.22); }
    </style>

<body>
<div id="ns-topbar"></div>
<script src="topbar.js"></script>


<div class="hdr">
    <div class="hdr-in">
        <div class="hdr-l">
            <div class="hdr-title">提示词生成</div>
            <div class="hdr-sub">上传产品图片，生成专业 AI 摄影提示词</div>
        </div>
        <div class="hdr-tag"><i></i>生图第一步</div>
    </div>
</div>

<div class="outer">
    <div class="wrap">
        <!-- Left -->
        <div class="left">
            <div>
                <div class="sec-title">上传图片</div>
                <div style="display:flex;flex-direction:column;gap:10px">
                    <div>
                        <span class="field-label">产品图</span>
                        <div class="up-area" id="pArea" onclick="$('pFile').click()" ondragover="dOver(event,this)" ondragleave="dLeave(event,this)" ondrop="dDrop(event,this,'p')">
                            <input type="file" id="pFile" accept="image/*" style="display:none" onchange="fSel(event,'p')">
                            <div id="pContent">
                                <div class="up-ico">↑</div>
                                <div class="up-txt">点击上传产品图</div>
                                <div class="up-hint">拖拽图片至此或点击浏览</div>
                            </div>
                        </div>
                    </div>
                    <div>
                        <span class="field-label">参考风格图（选填）</span>
                        <div class="up-area" id="rArea" onclick="$('rFile').click()" ondragover="dOver(event,this)" ondragleave="dLeave(event,this)" ondrop="dDrop(event,this,'r')">
                            <input type="file" id="rFile" accept="image/*" style="display:none" onchange="fSel(event,'r')">
                            <div id="rContent">
                                <div class="up-ico">↑</div>
                                <div class="up-txt">点击上传参考图</div>
                                <div class="up-hint">拖拽图片至此或点击浏览</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <span class="field-label">补充说明（选填）</span>
                <textarea class="inp-textarea" id="desc" placeholder='例如：白色釉面陶瓷咖啡杯'></textarea>
            </div>

            <button class="gen-btn" id="genBtn" onclick="generate()">生成提示词</button>
            <div class="side-quota">
                <div class="quota-tag" id="quotaSide"></div>
            </div>
        </div>

        <!-- Right -->
        <div class="right">
            <div class="right-inner">
                <div class="right-top">
                    <span class="right-title" id="rTitle">生成结果</span>
                    <div class="right-actions" id="rActions" style="display:none">
                        <button class="act-btn" onclick="resetAll()">重新开始</button>
                    </div>
                </div>
                <div class="right-body" id="rBody">
                    <div class="empty" id="vEmpty">
                        <div class="empty-ico">◇</div>
                        <div class="empty-t">准备开始</div>
                        <div class="empty-d">上传产品图，生成可直接用的提示词</div>
                    </div>
                    <div class="ldg" id="vLoad" style="display:none">
                        <div class="spin"></div>
                        <div class="ldg-txt" id="ldgTxt">正在上传图片...</div>
                    </div>
                    <div class="res-wrap" id="vRes" style="display:none">
                        <div class="md-body" id="resBody"></div>
                    </div>
                    <div class="err" id="vErr" style="display:none">
                        <div class="err-ico">✕</div>
                        <div class="err-t">生成失败</div>
                        <div class="err-d" id="errTxt">请稍后重试</div>
                        <button class="retry-btn" onclick="generate()">重新生成</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const BOT_ID = '7648485634986115106';
/* 所有 AI 请求走自有中转，Coze 令牌只存在服务端，前端拿不到 */
const API_BASE = 'https://najia-api-vsusfefxze.cn-hangzhou.fcapp.run';
async function callApi(type, payload) {
    const r = await fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify({ type: type, payload: payload })
    });
    const txt = await r.text();
    let data;
    try { data = JSON.parse(txt); } catch (e) { data = { error: { message: txt || ('HTTP ' + r.status) } }; }
    return { ok: r.ok, status: r.status, data: data };
}
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const rd = new FileReader();
        rd.onload = () => {
            const str = String(rd.result || '');
            const i = str.indexOf(',');
            resolve(i >= 0 ? str.slice(i + 1) : str);
        };
        rd.onerror = reject;
        rd.readAsDataURL(file);
    });
}

    /* ===== 体验额度 & 激活（一个码只认一个工具：盐里带本工具标记 kc，别处的码在本页无效） ===== */
    var LICENSE_SALT = 'naji-ark-2026-kc';
    var FREE_LIMIT = 3;
    var WECHAT_ID = 'najia9864';
    var LIC_KEY = 'nj_lic_kc';
    var USED_KEY = 'nj_free_used_kc';
    function licHash(x) {
        var h = 0;
        for (var i = 0; i < x.length; i++) { h = (h * 31 + x.charCodeAt(i)) >>> 0; }
        return h.toString(36).toUpperCase().padStart(4, '0').slice(0, 4);
    }
    function licValid(code) {
        var c = (code || '').trim().toUpperCase().replace(/[\s-]/g, '');
        var m = c.match(/^NJ([A-Z0-9]{8})([A-Z0-9]{4})$/);
        if (!m) return false;
        return licHash(LICENSE_SALT + m[1]) === m[2]  // 盐放前面：校验位才会带工具标记，别工具的码进不来;
    }
    function isLicensed() {
        try { return localStorage.getItem(LIC_KEY) === '1'; } catch (e) { return false; }
    }
    function getFreeUsed() {
        try { return parseInt(localStorage.getItem(USED_KEY) || '0', 10) || 0; } catch (e) { return 0; }
    }
    function setFreeUsed(n) {
        try { localStorage.setItem(USED_KEY, String(n)); } catch (e) {}
    }
    function freeLeft() { return Math.max(0, FREE_LIMIT - getFreeUsed()); }
    function renderQuota() {

async function generate() {
    if (busy) return;
    if (!pFile) return alert('请先上传产品图');
    if (!isLicensed() && freeLeft() <= 0) { openBuyDlg(); return; }

    busy = true;
    $('genBtn').disabled = true;
    showV('l');

    try {
        $('ldgTxt').textContent = '正在上传图片...';
        const pId = await uploadFile(pFile);
        let rId = null;
        if (rFile) rId = await uploadFile(rFile);

        $('ldgTxt').textContent = '正在生成提示词...';
        const answer = await doChat(pId, rId);

        showV('r');
        renderResult(answer);
        if (!isLicensed()) { setFreeUsed(getFreeUsed() + 1); renderQuota(); }
    } catch (err) {
        console.error(err);
        showV('x');
        $('errTxt').textContent = err.message || '请稍后重试';
    } finally {
        busy = false;
        $('genBtn').disabled = false;
    }
}

async function uploadFile(file) {
    const b64 = await fileToBase64(file);
    const resp = await callApi('coze', {
        action: 'upload',
        filename: file.name || 'upload.jpg',
        mime: file.type || 'image/jpeg',
        data: b64
    });
    const d = resp.data || {};
    if (d.code !== 0) throw new Error(`上传失败: ${d.msg || JSON.stringify(d)}`);
    return d.data.id;
}

async function doChat(pId, rId) {
    const desc = $('desc').value.trim();
    const parts = [];

    if (rId) {
        let txt = '第一张是产品图，第二张是参考风格图';
        if (desc) txt += `（产品：${desc}）`;
        txt += '。请生成融合参考图风格的AI生图提示词。';
        parts.push({ type: 'text', text: txt });
        parts.push({ type: 'image', file_id: pId });
        parts.push({ type: 'image', file_id: rId });
    } else {
        let txt = '请根据我上传的产品图';
        if (desc) txt += `（${desc}）`;
        txt += '，生成3个不同场景的AI生图提示词。';
        parts.push({ type: 'text', text: txt });
        parts.push({ type: 'image', file_id: pId });
    }

    const cr = await callApi('coze', {
        action: 'chat',
        body: {
            bot_id: BOT_ID,
            user_id: uid,
            stream: false,
            auto_save_history: true,
            additional_messages: [{
                role: 'user',
                content: JSON.stringify(parts),
                content_type: 'object_string'
            }]
        }
    });
    const cd = cr.data || {};
    if (cd.code !== 0) throw new Error(`对话失败: ${cd.msg || JSON.stringify(cd)}`);

    const chatId = cd.data.id;
    const convId = cd.data.conversation_id;

    for (let i = 0; i < 90; i++) {
        await sleep(2000);
        $('ldgTxt').textContent = `正在生成... (${(i + 1) * 2}s)`;
        const sr = await callApi('coze', { action: 'retrieve', chat_id: chatId, conversation_id: convId });
        const sd = sr.data || {};
        if (sd.code !== 0) throw new Error(`状态查询失败: ${sd.msg}`);
        if (sd.data.status === 'completed') return await getMsgs(convId, chatId);
        if (sd.data.status === 'failed') throw new Error('生成失败，请重试');
    }
    throw new Error('生成超时，请重试');
}

async function getMsgs(convId, chatId) {
    const r = await callApi('coze', { action: 'messages', chat_id: chatId, conversation_id: convId });
    const d = r.data || {};
    if (d.code !== 0) throw new Error(`获取结果失败: ${d.msg}`);
    for (const m of (d.data || [])) {
        if (m.role === 'assistant' && m.type === 'answer') return m.content;
    }
    throw new Error('未获取到有效回复');
}

// ===== Parse result: split by scene headings =====
function renderResult(text) {
    const container = $('resBody');
    container.innerHTML = '';

    const sceneRegex = /\*{0,2}场景[一二三四五六七八九十]+[：:·]/g;
    const scenes = [];
    let m;

    while ((m = sceneRegex.exec(text)) !== null) {
        scenes.push({ start: m.index, matchLen: m[0].length });
    }

    if (scenes.length === 0) {
        const codeBlockRegex = /```[\w]*\n([\s\S]*?)```/g;
        const codePrompts = [];
        let cm;
        while ((cm = codeBlockRegex.exec(text)) !== null) {
            codePrompts.push(cm[1].trim());
        }

        if (codePrompts.length > 0) {
            const analysisText = text.replace(/```[\w]*\n[\s\S]*?```/g, '').trim();
            if (analysisText) {
                const div = document.createElement('div');
                div.className = 'md-body';
                div.innerHTML = marked.parse(analysisText);
                container.appendChild(div);
            }
            const st = document.createElement('div');
            st.style.cssText = 'font-size:16px;font-weight:700;margin:28px 0 8px;padding-bottom:8px;border-bottom:1px solid var(--border)';
            st.textContent = '提示词';
            container.appendChild(st);
            codePrompts.forEach((prompt, idx) => {
                let cleanPrompt = prompt.replace(/```[\w]*\n?/g, '').replace(/```/g, '').trim();
                addPromptCard(container, `场景 ${idx + 1}`, cleanPrompt);
            });
        } else {
            const div = document.createElement('div');
            div.className = 'md-body';
            div.innerHTML = marked.parse(text);
            container.appendChild(div);
        }
        return;
    }

    const analysisText = text.substring(0, scenes[0].start).trim();

    if (analysisText) {
        const div = document.createElement('div');
        div.className = 'md-body';
        div.innerHTML = marked.parse(analysisText);
        container.appendChild(div);
    }

    const st = document.createElement('div');
    st.style.cssText = 'font-size:16px;font-weight:700;margin:28px 0 8px;padding-bottom:8px;border-bottom:1px solid var(--border)';
    st.textContent = '提示词';
    container.appendChild(st);

    scenes.forEach((scene, idx) => {
        const nextStart = idx + 1 < scenes.length ? scenes[idx + 1].start : text.length;
        let sceneText = text.substring(scene.start, nextStart).trim();

        // Strip code fence markers (```python, ```, etc.)
        sceneText = sceneText.replace(/```[\w]*\n?/g, '').replace(/```/g, '').trim();

        const firstNewline = sceneText.indexOf('\n');
        const titleLine = firstNewline > -1 ? sceneText.substring(0, firstNewline) : sceneText;
        const bodyText = firstNewline > -1 ? sceneText.substring(firstNewline + 1).trim() : '';

        let cleanTitle = titleLine.replace(/\*+/g, '').trim();

        addPromptCard(container, cleanTitle, bodyText);
    });
}

function addPromptCard(container, title, body) {
    const card = document.createElement('div');
    card.className = 'prompt-card';
    card.innerHTML = `
        <div class="prompt-card-title">${escapeHtml(title)}</div>
        <div class="prompt-card-body">${escapeHtml(body)}</div>
        <button class="prompt-copy" onclick="copyPrompt(this)">复制</button>
    `;
    container.appendChild(card);
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function copyPrompt(btn) {
    const body = btn.parentElement.querySelector('.prompt-card-body');
    navigator.clipboard.writeText(body.textContent).then(() => {
        btn.textContent = '已复制';
        setTimeout(() => btn.textContent = '复制', 1500);
    });
}

    uid = 'u_' + Math.random().toString(36).slice(2, 11);
