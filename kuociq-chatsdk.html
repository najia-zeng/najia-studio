<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>娜家扩词器 - AI生图提示词生成</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f7f6f3;
            color: #333;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 24px 100px;
        }
        header {
            text-align: center;
            margin-bottom: 48px;
        }
        header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: 3px;
        }
        .subtitle {
            margin-top: 12px;
            font-size: 16px;
            color: #888;
        }
        .tagline {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            line-height: 1.8;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 40px 0;
        }
        .feature-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #e8e5e0;
        }
        .feature-card h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a1a1a;
        }
        .feature-card p {
            font-size: 13px;
            color: #888;
            line-height: 1.6;
        }
        .cta-section {
            text-align: center;
            margin: 40px 0;
            padding: 40px;
            background: #fff;
            border-radius: 16px;
            border: 1px solid #e8e5e0;
        }
        .cta-section p {
            font-size: 14px;
            color: #888;
            margin-bottom: 20px;
        }
        .cta-btn {
            display: inline-block;
            padding: 14px 40px;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cta-btn:hover { background: #333; }
        .hint {
            margin-top: 16px;
            font-size: 12px;
            color: #bbb;
        }
        #debug-log {
            display: none;
            margin-top: 20px;
            padding: 16px;
            background: #fff3f3;
            border: 1px solid #ffcccc;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            color: #cc0000;
            white-space: pre-wrap;
            text-align: left;
        }
        footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 24px;
            border-top: 1px solid #e8e5e0;
            font-size: 13px;
            color: #bbb;
        }
        @media (max-width: 480px) {
            .features { grid-template-columns: 1fr; }
            header h1 { font-size: 24px; }
            .container { padding: 40px 16px 80px; }
        }
    
/* ===== 全站统一顶栏 ===== */
#ns-topbar{position:sticky;top:0;z-index:9999;height:70px;flex-shrink:0;
  display:flex;align-items:center;gap:20px;padding:0 46px;box-sizing:border-box;
  background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:1px solid #e8e8ed;
  font-family:"Space Grotesk","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;}
#ns-topbar *{box-sizing:border-box;}
#ns-topbar .brand{display:flex;align-items:center;gap:12px;padding:0;text-decoration:none;}
#ns-topbar .logo{width:42px;height:42px;border-radius:13px;flex-shrink:0;overflow:hidden;background:#0a0a0a;box-shadow:0 3px 10px rgba(37,54,73,.20);}
#ns-topbar .logo img{width:100%;height:100%;object-fit:cover;display:block;}
#ns-topbar .bt{line-height:1.35;}
#ns-topbar .bt b{display:block;font-size:17.5px;font-weight:650;color:#1a1a2e;line-height:1.2;}
#ns-topbar .bt span{font-size:14px;letter-spacing:.5px;color:#9a94b8;margin-top:3px;display:block;}
#ns-topbar .topnav{margin-left:auto;display:flex;align-items:center;gap:12px;}
#ns-topbar .tbtn{font-size:14px;font-weight:600;color:#fff;background:#6b5ce7;
  border:1px solid #6b5ce7;border-radius:999px;padding:10px 26px;
  text-decoration:none;line-height:1.2;white-space:nowrap;
  box-shadow:0 2px 8px rgba(107,92,231,.22);transition:filter .15s;cursor:pointer;}
#ns-topbar .tbtn:hover{filter:brightness(1.08);}
@media(max-width:768px){
  #ns-topbar{height:auto;padding:10px 14px;gap:10px;flex-wrap:wrap;}
  #ns-topbar .topnav{margin-left:0;width:100%;gap:8px;}
  #ns-topbar .tbtn{width:100%;text-align:center;}
}
</style>
</head>
<body>
<header id="ns-topbar">
  <a class="brand" href="https://www.najiastudio.com/">
    <div class="logo"><img src="img/logo.png" alt="NaStudio"></div>
    <div class="bt"><b>NaStudio</b><span>娜家视觉</span></div>
  </a>
  <div class="topnav">
    <a class="tbtn" href="https://www.najiastudio.com/member.html">实拍+AI实操手册</a>
    <a class="tbtn" href="https://www.najiastudio.com/product.html">娜家拍摄台系列产品</a>
  </div>
</header>

    <div class="container">
        <header>
            <h1>娜家扩词器</h1>
            <p class="subtitle">产品信息 → 专业AI生图提示词</p>
            <p class="tagline">
                不用学摄影，也能生成能卖货的产品图提示词。<br>
                上传产品图，一键生成专业级AI生图提示词。
            </p>
        </header>

        <div class="features">
            <div class="feature-card">
                <h3>模式一：只给产品图</h3>
                <p>上传一张产品图，自动生成3个不同场景的完整提示词，直接复制使用</p>
            </div>
            <div class="feature-card">
                <h3>模式二：产品图+参考图</h3>
                <p>上传产品图和喜欢的风格参考图，生成1个融合参考风格的定制提示词</p>
            </div>
        </div>

        <div class="cta-section">
            <p>点击右下角对话按钮，开始生成提示词</p>
            <button class="cta-btn" id="openChatBtn">开始使用</button>
            <p class="hint">支持上传图片 · 六段式专业提示词 · 一键复制</p>
            <div id="debug-log"></div>
        </div>

        <footer>
            娜家 · 专业级产品图解决方案
        </footer>
    </div>

    <!-- Coze Chat SDK - 正确的CDN地址 -->
    <script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.10/libs/cn/index.js"></script>
    <script>
        var debugEl = document.getElementById('debug-log');

        function debugLog(msg) {
            console.log('[扩词器]', msg);
            debugEl.style.display = 'block';
            debugEl.textContent += msg + '\n';
        }

        // 检查SDK是否加载
        if (typeof CozeWebSDK === 'undefined') {
            debugLog('ERROR: CozeWebSDK 未加载，SDK脚本可能加载失败');
        } else {
            debugLog('CozeWebSDK 已加载');

            try {
                var client = new CozeWebSDK.WebChatClient({
                    config: {
                        botId: '7648485634986115106',
                    },
                    auth: {
                        type: 'token',
                        token: 'pat_PhEDXpXbc1Zlcilk3HT4z18ZbhxhKmPAF6g5aatGxTB2xfVlS6tg6nrZrH2WP2Cy',
                        onRefreshToken: async function() {
                            return 'pat_PhEDXpXbc1Zlcilk3HT4z18ZbhxhKmPAF6g5aatGxTB2xfVlS6tg6nrZrH2WP2Cy';
                        },
                    },
                    ui: {
                        asstBtn: {
                            isNeed: true,
                        },
                        base: {
                            lang: 'zh-CN',
                        },
                        chatBot: {
                            title: '娜家扩词器',
                            uploadable: true,
                        },
                        footer: {
                            isShow: false,
                        },
                    },
                });
                debugLog('Chat SDK 初始化成功！右下角应出现悬浮球');

                document.getElementById('openChatBtn').addEventListener('click', function() {
                    try {
                        client.showChatBot();
                    } catch(e) {
                        debugLog('showChatBot 报错: ' + e.message);
                    }
                });
            } catch(e) {
                debugLog('Chat SDK 初始化失败: ' + e.message);
            }
        }
    </script>
</body>
</html>
