<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科研医美风 · 场景生图 - NaStudio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f6f6fb; --card: #ffffff; --border: #e7e7f0;
            --text: #1b1b2f; --text-sec: #7b7b93;
            --accent: #6b5ce7; --accent-h: #5a4bd6;
            --accent-2: #4a7cf7;
            --grad: linear-gradient(135deg, #6b5ce7 0%, #4a7cf7 100%);
            --radius: 16px; --radius-s: 12px;
        }
        body { font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif; color: var(--text); height: 100vh; overflow: hidden;
            background: radial-gradient(1100px 480px at 50% -90px, #EDE9FF 0%, rgba(237,233,255,0) 62%), #f6f6fb; }
        .page { max-width: 1400px; margin: 0 auto; height: calc(100vh - 66px); }

        .hdr { height: 92px; background: linear-gradient(100deg, #ffffff 0%, #fbfaff 42%, #f2efff 100%); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; position: relative; flex-shrink: 0; }
        .hdr::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--grad); opacity: .5; }
        .hdr-logo { width: 34px; height: 34px; border-radius: 9px; object-fit: cover; }
        .hdr-l { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
        .hdr-title { font-size: 27px; font-weight: 750; letter-spacing: -.6px; line-height: 1.12; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .hdr-sub { font-size: 13px; color: var(--text-sec); letter-spacing: .2px; }
        .hdr-tag { flex-shrink: 0; display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: #6b5ce7; background: rgba(107,92,231,.08); border: 1px solid rgba(107,92,231,.18); border-radius: 999px; padding: 7px 15px; font-weight: 500; }
        .hdr-tag i { width: 6px; height: 6px; border-radius: 50%; background: var(--grad); display: block; }
        @media (max-width: 720px) {
            .hdr { height: auto; padding: 14px 16px; flex-wrap: wrap; gap: 10px; }
            .hdr-title { font-size: 21px; }
            .hdr-tag { display: none; }
        }

        .wrap { display: flex; height: calc(100vh - 122px); }
        .left { width: 340px; min-width: 340px; background: var(--card); border-right: 1px solid var(--border); padding: 24px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; box-shadow: 6px 0 28px rgba(27,27,47,.04); position: relative; z-index: 2; }
        .left::-webkit-scrollbar { width: 4px; }
        .left::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }
        .sec-label { font-size: 13px; font-weight: 600; color: var(--text-sec); letter-spacing: 1px; margin-bottom: 8px; }

        .up-area { border: 1px dashed var(--border); border-radius: var(--radius-s); padding: 24px 14px; text-align: center; cursor: pointer; transition: all .2s; position: relative; background: #fafafa; min-height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .up-area:hover { border-color: #b9b0ff; background: #fbfaff; }
        .up-area.has { border-style: solid; border-color: var(--accent); padding: 8px; background: #fff; }
        .up-ico { font-size: 26px; margin-bottom: 6px; color: #bbb; }
        .up-txt { font-size: 14px; color: var(--text-sec); line-height: 1.5; }
        .up-prev { max-width: 100%; max-height: 140px; border-radius: 6px; object-fit: contain; }
        .up-rm { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; background: rgba(0,0,0,.4); color: #fff; border: none; border-radius: 50%; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: background .15s; z-index: 2; }
        .up-rm:hover { background: rgba(0,0,0,.7); }

        .gen-btn { width: 100%; padding: 15px; background: var(--grad); color: #fff; border: none; border-radius: var(--radius-s); font-size: 16px; font-weight: 500; cursor: pointer; font-family: inherit; transition: all .22s; box-shadow: 0 6px 18px rgba(107,92,231,.28); }
        .gen-btn:hover { box-shadow: 0 9px 26px rgba(107,92,231,.4); transform: translateY(-1px); }
        .gen-btn:disabled { opacity: .35; cursor: not-allowed; }

        .right { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; }
        .right::-webkit-scrollbar { width: 6px; }
        .right::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

        .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 19vh; text-align: center; }
        .empty-ico { width: 72px; height: 72px; border: 2px solid #ddd8ff; border-radius: 14px; display: flex; align-items: center; justify-content: center; transform: rotate(45deg); margin-bottom: 24px; background: linear-gradient(135deg, #fbfaff, #f4f2ff); }
        .empty-ico span { transform: rotate(-45deg); font-size: 24px; color: #ccc; }
        .empty-t { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
        .empty-d { font-size: 14px; color: var(--text-sec); max-width: 340px; line-height: 1.7; }

        .ldg { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spin { width: 40px; height: 40px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: sp .7s linear infinite; }
        @keyframes sp { to { transform: rotate(360deg); } }
        .ldg-txt { margin-top: 16px; font-size: 15px; color: var(--text-sec); }
        .ldg-sub { margin-top: 4px; font-size: 13px; color: #bbb; }
        .ldg-steps { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
        .ldg-step { font-size: 13px; color: var(--text-sec); display: flex; align-items: center; gap: 8px; }
        .ldg-step .step-ico { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; }
        .ldg-step .step-ico.done { background: #34c759; color: #fff; }
        .ldg-step .step-ico.active { background: var(--accent); color: #fff; animation: pulse 1s infinite; }
        .ldg-step .step-ico.wait { background: var(--border); color: #fff; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }

        .res-wrap { max-width: 1100px; margin: 0 auto; width: 100%; }
        .res-top { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .res-top h2 { font-size: 17px; font-weight: 500; }
        .dlg-mask { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
        .dlg { background: #fff; border-radius: 14px; width: 100%; max-width: 520px; max-height: 88vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.18); }
        .dlg-h { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 500; }
        .dlg-x { cursor: pointer; color: #bbb; font-size: 20px; line-height: 1; }
        .dlg-x:hover { color: #666; }
        .dlg-b { padding: 18px 22px; }
        .dlg-p { font-size: 13px; color: var(--text-sec); line-height: 1.7; margin: 0 0 14px; }
        .dlg-steps { background: #fafafa; border-radius: 10px; padding: 13px 16px; margin-bottom: 14px; }
        .dlg-steps .st { font-size: 12.5px; color: var(--text-sec); line-height: 1.7; padding: 6px 0 6px 27px; position: relative; }
        .dlg-steps .st b { position: absolute; left: 0; top: 6px; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 1px solid var(--border); color: #999; font-weight: 500; font-size: 11px; line-height: 16px; text-align: center; box-sizing: border-box; }
        .dlg-steps .mn { color: #555; font-weight: 500; }
        .dlg-steps a { color: #4a7cf7; text-decoration: none; border-bottom: 1px solid rgba(74,124,247,.35); }
        .dlg-steps a:hover { border-bottom-color: #4a7cf7; }
        .dlg-note { font-size: 11.5px; color: #a8a8a8; line-height: 1.65; margin: 0 0 14px; }
        .dlg-note a { color: #7a9ef9; text-decoration: none; }
        .quota-tag { font-size: 12px; color: #999; margin-right: 14px; white-space: nowrap; }
        .quota-tag b { font-weight: 500; color: #555; }
        .quota-tag.used { color: #d9534f; }
        .dlg-opt { border: 1px solid var(--border); border-radius: 10px; padding: 13px 15px; margin-bottom: 10px; }
        .dlg-opt .opt-h { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 5px; }
        .dlg-opt .opt-p { font-size: 12.5px; color: var(--text-sec); line-height: 1.7; }
        .dlg-opt .opt-p a { color: #4a7cf7; cursor: pointer; text-decoration: none; border-bottom: 1px solid rgba(74,124,247,.35); }
        .dlg-opt .opt-p b { font-weight: 500; color: #444; }
        .dlg-in { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; color: var(--text); }
        .dlg-in:focus { outline: none; border-color: #999; }
        .dlg-err { font-size: 12px; color: #d9534f; min-height: 18px; padding-top: 6px; }
        .dlg-f { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 22px 20px; }
        .dlg-btn { padding: 10px 22px; border-radius: 9px; border: none; background: var(--grad); color: #fff; font-size: 13px; cursor: pointer; font-family: inherit; box-shadow: 0 4px 12px rgba(107,92,231,.22); }
        .dlg-btn:hover { box-shadow: 0 6px 16px rgba(107,92,231,.32); }
        .dlg-btn.ghost { background: #fff; color: var(--text-sec); border-color: var(--border); }
        .dlg-btn.ghost:hover { background: #f5f5f5; }
        .dlg-buy { max-width: 430px; position: relative; }
        .dlg-x2 { position: absolute; right: 15px; top: 11px; color: #c9c9d6; font-size: 22px; line-height: 1; cursor: pointer; z-index: 3; background: none; border: none; font-family: inherit; padding: 4px; }
        .dlg-x2:hover { color: #888; }
        .dlg-buy .dlg-b { padding: 34px 26px 4px; }
        .dlg-t1 { font-size: 24px; font-weight: 700; color: var(--text); text-align: center; letter-spacing: 1.5px; }
        .dlg-t2 { font-size: 13px; color: var(--text-sec); text-align: center; margin: 11px 0 22px; line-height: 1.65; }
        .qr-wrap { margin-bottom: 0; }
        .qr-box { display: block; border: 1px dashed #d9d9e6; border-radius: 16px; background: #fafafd; padding: 22px 18px 15px; }
        .qr-box img { display: block; width: 190px; height: 190px; object-fit: contain; border-radius: 10px; background: #fff; margin: 0 auto; }
        .qr-tip { font-size: 13px; color: #9c9cb2; text-align: center; margin-top: 13px; }
        .qr-or { font-size: 13px; color: #8d8da3; text-align: center; margin: 20px 0 11px; }
        .qr-id { text-align: center; font-size: 19px; font-weight: 700; letter-spacing: 1.2px; color: var(--accent); background: #f4f2fd; border-radius: 10px; padding: 11px; cursor: pointer; user-select: all; transition: background .15s, color .15s; }
        .qr-id:hover { background: #ebe7fb; }
        .qr-id.copied { background: #e9f8ee; color: #2f9e57; }
        .lic-mini { font-size: 11.5px; color: #bcbccb; text-align: center; margin: 20px 0 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
        .lic-mini:hover { color: var(--accent); }
        .lic-row { display: flex; gap: 8px; }
        .lic-row .dlg-in { flex: 1; min-width: 0; }
        .lic-btn { padding: 0 17px; border-radius: 8px; border: 1px solid var(--accent); background: #fff; color: var(--accent); font-size: 13px; cursor: pointer; font-family: inherit; white-space: nowrap; }
        .lic-btn:hover { background: #f4f2fd; }
        .cost-tag { font-size: 12px; font-weight: 400; color: #999; margin-left: 14px; letter-spacing: 0; }
        .cost-tag b { font-weight: 500; color: #666; }
        .res-actions-top { display: flex; gap: 10px; }
        .new-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-s); font-size: 13px; cursor: pointer; font-family: inherit; transition: all .15s; color: var(--text-sec); }
        .new-btn:hover { border-color: #999; color: var(--text); }

        .res-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
        .res-card-img { padding: 12px; display: flex; align-items: center; justify-content: center; background: #fafafa; }
        .res-card-img img { max-width: 100%; max-height: 630px; object-fit: contain; border-radius: 4px; }
        .res-card-actions { padding: 14px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

        .err { text-align: center; padding: 40px; }
        .err-ico { font-size: 40px; margin-bottom: 16px; }
        .err-t { font-size: 17px; font-weight: 500; margin-bottom: 8px; }
        .err-d { font-size: 14px; color: var(--text-sec); line-height: 1.7; max-width: 400px; margin: 0 auto; }
        .retry-btn { margin-top: 16px; padding: 10px 28px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-s); cursor: pointer; font-size: 14px; font-family: inherit; }

        .style-grid { display: flex; flex-direction: column; gap: 7px; }
        .style-card { border: 1px solid var(--border); border-radius: var(--radius-s); padding: 9px 12px; cursor: pointer; transition: all .15s; background: #fafafa; }
        .style-card:hover { border-color: #bbb; }
        .style-card.active { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(107,92,231,.14); }
        .style-card b { font-size: 14px; display: block; margin-bottom: 2px; font-weight: 500; }
        .style-card span { font-size: 12px; color: var(--text-sec); line-height: 1.4; }
        .ratio-row { display: flex; gap: 7px; }
        .ratio-btn { flex: 1; padding: 9px 0; border: 1px solid var(--border); background: #fafafa; border-radius: 8px; font-size: 12px; cursor: pointer; font-family: inherit; color: var(--text-sec); transition: all .15s; }
        .ratio-btn:hover { border-color: #bbb; }
        .ratio-btn.active { border-color: transparent; background: var(--grad); color: #fff; box-shadow: 0 4px 12px rgba(107,92,231,.24); }
        .opt-tag { font-size: 11px; color: #aaa; font-weight: 400; margin-left: 4px; }
        .set-name { font-size: 12px; color: var(--text-sec); margin-bottom: 6px; }
        .res-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
        @media (max-width: 1080px) { .res-grid { grid-template-columns: 1fr; } }
        .res-card-body { padding: 10px 14px 14px; }
        .tune-row { display: flex; gap: 8px; margin: 8px 0 10px; align-items: stretch; }
        .tune-box { flex: 1; min-height: 52px; max-height: 140px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; font-family: inherit; color: var(--text); resize: vertical; line-height: 1.55; background: #fafafa; }
        .tune-box:focus { outline: none; border-color: #999; background: #fff; }
        .tune-box::placeholder { color: #bbb; }
        .tune-btn { padding: 0 16px; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px; font-size: 12px; cursor: pointer; font-family: inherit; white-space: nowrap; }
        .tune-btn:hover { background: var(--accent-h); }
        .tune-hint { font-size: 11px; color: #b0b0b0; line-height: 1.5; margin: 0 0 8px; }
        .res-links { display: flex; gap: 16px; justify-content: center; align-items: center; }
        .res-links a { font-size: 13px; color: var(--text-sec); text-decoration: none; cursor: pointer; }
        .res-links a:first-child { color: var(--text); }
        .res-links a:hover { color: var(--text); }


        @media (max-width: 860px) {
            .wrap { flex-direction: column; height: auto; }
            .left { width: 100%; min-width: 0; border-right: none; border-bottom: 1px solid var(--border); max-height: 50vh; }
            .right { min-height: 50vh; }
        }
    </style>
<style>
/* ===== NaStudio 统一顶栏（与主页一致） ===== */
#ns-topbar{position:sticky;top:0;z-index:9999;height:66px;flex-shrink:0;
  display:flex;align-items:center;gap:16px;padding:0 28px;box-sizing:border-box;
  background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:1px solid #e8e8ed;
  font-family:"Space Grotesk","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;}
#ns-topbar *{box-sizing:border-box;}
#ns-topbar .brand{display:flex;align-items:center;gap:11px;padding:0;text-decoration:none;}
#ns-topbar .logo{width:38px;height:38px;border-radius:12px;flex-shrink:0;overflow:hidden;background:#0a0a0a;box-shadow:0 3px 9px rgba(37,54,73,.18);}
#ns-topbar .logo img{width:100%;height:100%;object-fit:cover;display:block;}
#ns-topbar .bt{line-height:1.35;}
#ns-topbar .bt b{display:block;font-size:17px;font-weight:650;color:#1a1a2e;line-height:1.2;}
#ns-topbar .bt span{font-size:12px;letter-spacing:.8px;color:#9a94b8;margin-top:3px;display:block;}
#ns-topbar .topnav{margin-left:auto;display:flex;align-items:center;gap:10px;}
#ns-topbar .tbtn{font-size:15px;font-weight:600;color:#6b5ce7;background:#fff;
  border:1px solid #e2ddfb;border-radius:10px;padding:10px 22px;
  text-decoration:none;line-height:1.2;white-space:nowrap;transition:all .15s;}
#ns-topbar .tbtn:hover{border-color:#c9c1f5;color:#5a4be0;}
#ns-topbar .tbtn.on{color:#fff;background:#6b5ce7;border-color:#6b5ce7;
  box-shadow:0 3px 10px rgba(107,92,231,.26);}

@media(max-width:768px){
  #ns-topbar{height:auto;padding:10px 14px;gap:10px;flex-wrap:wrap;}
  #ns-topbar .topnav{margin-left:0;width:100%;gap:8px;}
  #ns-topbar .tbtn{width:100%;text-align:center;}
}
</style>
<!-- 本工具可安装到桌面（PWA）：客户解锁后双击桌面图标即用 -->
<link rel="manifest" href="/manifest-sg.webmanifest">
<meta name="theme-color" content="#6b5ce7">
<link rel="icon" href="/img/icon-sg-192.png" type="image/png">
<link rel="apple-touch-icon" href="/img/icon-sg-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="科研医美">

</head>
<body>
<div id="ns-topbar"></div>
<script src="topbar.js"></script>


<div class="page">
<div class="hdr">
    <div class="hdr-l">
        <div class="hdr-title">科研医美风 · 场景生图</div>
        <div class="hdr-sub">上传产品白底图，一次出 4 张同风格场景图</div>
    </div>
    <div class="hdr-tag"><i></i>专为美妆护肤场景</div>
</div>
<div class="wrap">
    <div class="left">
        <div>
            <div class="sec-label">① 产品白底图</div>
            <div class="up-area" id="pdArea" onclick="$('pdFile').click()" ondragover="dOver(event,this)" ondragleave="dLeave(event,this)" ondrop="dDrop(event,this,'pd')">
                <input type="file" id="pdFile" accept="image/*" style="display:none" onchange="pdSel(event)">
                <div id="pdContent"><div class="up-ico">📦</div><div class="up-txt">上传产品白底图</div></div>
            </div>
        </div>
        <div>
            <div class="sec-label">② 画幅</div>
            <div class="ratio-row" id="ratioRow">
                <button class="ratio-btn active" data-r="1:1" onclick="pickRatio('1:1')">1:1 主图</button>
                <button class="ratio-btn" data-r="3:4" onclick="pickRatio('3:4')">3:4 竖版</button>
                <button class="ratio-btn" data-r="9:16" onclick="pickRatio('9:16')">9:16 长图</button>
            </div>
        </div>
        <div>
            <div class="sec-label">③ 产品大小</div>
            <div class="ratio-row" id="sizeRow">
                <button class="ratio-btn" data-s="small" onclick="pickSize('small')">小</button>
                <button class="ratio-btn active" data-s="medium" onclick="pickSize('medium')">中</button>
                <button class="ratio-btn" data-s="large" onclick="pickSize('large')">大</button>
            </div>
        </div>
        <button class="gen-btn" id="genBtn" onclick="generate()" disabled>生成 4 张场景图</button>
    </div>
    <div class="right" id="right">
        <div class="empty" id="vEmpty">
            <div class="empty-ico"><span>◇</span></div>
            <div class="empty-t">准备开始</div>
            <div class="empty-d">上传产品白底图，一次出 4 张科研医美风场景图</div>
        </div>
        <div class="ldg" id="vLoad" style="display:none">
            <div class="spin"></div>
            <div class="ldg-txt" id="ldgTxt">正在生成场景...</div>
            <div class="ldg-sub" id="ldgSub">大约需要20-40秒</div>
            <div class="ldg-steps">
                <div class="ldg-step" id="step1"><div class="step-ico wait">1</div>分析图片生成提示词</div>
                <div class="ldg-step" id="step2"><div class="step-ico wait">2</div>生成 4 张不同道具的场景图</div>

function autoCrop(imgSrc) {
    return new Promise(resolve => {
        const img = new Image(); img.onload = () => {
            const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
            const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0);
            const id = ctx.getImageData(0, 0, c.width, c.height), d = id.data, w = c.width, h = c.height, t = CROP_THRESHOLD;
            let top = 0, bottom = h - 1, left = 0, right = w - 1;
            for (let y = 0; y < h; y++) { let f = false; for (let x = 0; x < w; x++) { const i = (y * w + x) * 4; if (d[i] < t || d[i + 1] < t || d[i + 2] < t) { top = y; f = true; break; } } if (f) break; }
            for (let y = h - 1; y >= 0; y--) { let f = false; for (let x = 0; x < w; x++) { const i = (y * w + x) * 4; if (d[i] < t || d[i + 1] < t || d[i + 2] < t) { bottom = y; f = true; break; } } if (f) break; }
            for (let x = 0; x < w; x++) { let f = false; for (let y = top; y <= bottom; y++) { const i = (y * w + x) * 4; if (d[i] < t || d[i + 1] < t || d[i + 2] < t) { left = x; f = true; break; } } if (f) break; }
            for (let x = w - 1; x >= 0; x--) { let f = false; for (let y = top; y <= bottom; y++) { const i = (y * w + x) * 4; if (d[i] < t || d[i + 1] < t || d[i + 2] < t) { right = x; f = true; break; } } if (f) break; }
            const cw = right - left + 1, ch = bottom - top + 1, pad = CROP_PADDING;
            const cc = document.createElement('canvas'); cc.width = cw + pad * 2; cc.height = ch + pad * 2;
            const cctx = cc.getContext('2d'); cctx.fillStyle = '#FFFFFF'; cctx.fillRect(0, 0, cc.width, cc.height);
            cctx.drawImage(img, left, top, cw, ch, pad, pad, cw, ch);
            resolve(cc.toDataURL('image/png'));
        }; img.src = imgSrc;
    });
}

function resizeForAPI(dataUri, maxDim) {
    maxDim = maxDim || 1024;
    return new Promise(resolve => {
        const img = new Image(); img.onload = () => {
            if (img.width <= maxDim && img.height <= maxDim) { resolve(dataUri); return; }
            const s = maxDim / Math.max(img.width, img.height);
            const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            resolve(c.toDataURL('image/jpeg', 0.85));
        }; img.src = dataUri;
    });
}

// 关键：传给出图模型的参考图，本身就是「产品只占约 1/3、四周大量留白」的构图
// 模型会照抄参考图的占比感，比任何文字描述都管用
// 产品大小三档：ref 是参考图里产品占画布高度的比例，text 是写进提示词的区间
const SIZE_LEVELS = {
    small:  { ref: 0.30, text: '30%~36%' },
    medium: { ref: 0.40, text: '40%~46%' },
    large:  { ref: 0.50, text: '50%~56%' }
};
function prepareRefImage(dataUri, maxDim) {
    maxDim = maxDim || 1536;
    return new Promise(resolve => {
        const img = new Image(); img.onload = () => {
            const parts = (RATIOS[curRatio].size || '1728x2304').split('x');
            const rw = Number(parts[0]) || 3, rh = Number(parts[1]) || 4;
            const ch = maxDim;
            const cw = Math.round(ch * rw / rh);
            const prodH = Math.round(ch * (SIZE_LEVELS[curSize] ? SIZE_LEVELS[curSize].ref : 0.40));
            const scale = prodH / img.height;
            const prodW = Math.max(1, Math.round(img.width * scale));
            const c = document.createElement('canvas');
            c.width = cw; c.height = ch;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, cw, ch);
            ctx.drawImage(img, Math.round((cw - prodW) / 2), Math.round((ch - prodH) / 2), prodW, prodH);
            resolve(c.toDataURL('image/jpeg', 0.92));
        }; img.src = dataUri;
    });
}

        }
    }
    if (!data) throw new Error('场景图生成失败: ' + (lastErr || '所有图像模型均不可用'));
    const first = data.data && data.data[0];
    if (first && (first.b64_json || first.url)) addCost(1, COST_IMG);
    if (first && first.b64_json) return 'data:image/png;base64,' + first.b64_json;
    if (first && first.url) return first.url;
    if (first && first.error) throw new Error('图片生成错误: ' + first.error.message);
    throw new Error('未获取到图片结果');
}

function setStep(n) {
    for (let i = 1; i <= 2; i++) {
        const el = $('step' + i);
        if (!el) continue;
        const ico = el.querySelector('.step-ico');
        if (!ico) continue;
        ico.className = 'step-ico ' + (i < n ? 'done' : i === n ? 'active' : 'wait');
    }
}

// 抽 N 套不重复的道具
function pickSets() {
    const pool = curPack.sets.slice();
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
    return pool.slice(0, Math.min(SHOTS_PER_RUN, pool.length));
}

// 把微调指令接到提示词末尾：放最后、权重最高，用来覆盖前面的相关描述
function withTune(prompt, tune) {
    const t = (tune || '').trim();
    if (!t) return prompt;
    return prompt + '\n\n【额外调整 · 优先级最高，覆盖前面所有与之相关的描述】\n' + t;
}

// 微调用的「局部修改模式」：把上一张成品图当基准，锁死构图道具，只改一处
function withTuneLocked(prompt, tune) {
    const t = (tune || '').trim();
    if (!t) return prompt;
    const head =
        '【局部修改模式 · 本条优先级最高】\n' +
        '这不是重新创作，而是对一张已有成品图做局部修改。\n' +
        '本次给了两张参考图：参考图 1 是产品原图，只用来保证产品外观绝对不变；参考图 2 是上一轮的成品图，是本次修改的唯一基准。\n' +
        '必须严格保持参考图 2 的以下内容完全不变：画幅与构图、机位与透视角度、产品的大小与画面位置、每一件道具的形状/数量/位置/朝向、光影方向与强度、背景层次与渐变、整体色调与饱和度。\n' +
        '只修改下面指定的那一项，其余一切照旧。修改完成后，整张图除了这一项之外，必须与参考图 2 几乎一模一样，看不出是重画的。\n' +
        '禁止新增道具、禁止移动道具、禁止改变产品大小或位置、禁止改变机位角度、禁止整体重排画面。\n' +
        '本次修改只允许调整颜色、明暗、虚化程度、饱和度这类属性；道具的数量与摆放不在此次修改范围内，必须与参考图 2 完全一致。\n' +
        '万一指令里提到增删道具：只用原区域的背景、台面和光影自然补齐，画面其余部分必须原封不动，绝不能因此改变打光方式、明暗对比、背景渐变或色温。\n' +
        '如果修改涉及颜色、明暗或虚化程度，必须对画面中所有同类对象统一执行，不能只改其中一部分。\n' +
        '整张图的曝光、白平衡、背景明度必须与参考图 2 保持一致，允许的差异不超过肉眼几乎察觉不到的程度。禁止把亮调画面改成暗调，禁止加聚光灯、光斑、暗角或戏剧化打光，禁止改变背景的渐变方向。\n' +
        '产品的正面标签区必须始终完整可见，任何道具都不得移动到标签前方。\n' +
        '【本次唯一要修改的】\n' + t + '\n\n';
    const locked = prompt.replace('【场景道具】',
        '【场景道具 · 以下描述只用于识别参考图 2 里已经存在的道具，不得据此重新摆放、增删或替换】');
    return head + locked;
}

// 把上一张成品图压成小尺寸参考图，用来锁定构图（体积小、上传快）
function toSceneRef(src) {
    return new Promise(resolve => {
        if (!src) { resolve(null); return; }
        const img = new Image();
        if (!/^data:/.test(src)) img.crossOrigin = 'anonymous';
        img.onload = () => {
            try {
                const maxDim = 1280;
                const sc = Math.min(1, maxDim / Math.max(img.width, img.height));
                const c = document.createElement('canvas');
                c.width = Math.round(img.width * sc);
                c.height = Math.round(img.height * sc);
                c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                resolve(c.toDataURL('image/jpeg', 0.85));
            } catch (e) { resolve(src); }
        };
        img.onerror = () => resolve(src);
        img.src = src;
    });
}

// 按某个 view 组装最终提示词
function promptForView(item, view) {
    return withTune(buildScenePrompt(sceneProduct, sceneTone, sceneAccent, curPack, item.set), view.tune);
}

// 只跑出图，不重新分析（换一批道具用这个，省掉分析的钱和时间）
async function runShots() {
    if (!sceneProduct || !lastRefImage) return;
    busy = true; $('genBtn').disabled = true;
    try {
        showView('l');
        // 每次按当前画幅重做参考图，保证传进去的构图占比正确
        lastRefImage = await prepareRefImage(productCroppedSrc);
        const picked = pickSets();
        setStep(2);
        $('ldgTxt').textContent = '正在生成 ' + picked.length + ' 张场景图...';
        $('ldgSub').textContent = curPack.name + ' · ' + RATIOS[curRatio].label + ' · 大约需要 40-70 秒';

        const settled = await Promise.allSettled(
            picked.map(set => generateSceneImage(buildScenePrompt(sceneProduct, sceneTone, sceneAccent, curPack, set), lastRefImage))
        );

        const items = [];
        settled.forEach((r, i) => {
            if (r.status === 'fulfilled' && r.value) {
                items.push({
                    name: picked[i].name,
                    set: picked[i],
                    active: 0,
                    views: [{ angle: '主图', src: r.value, refImage: lastRefImage, tune: '' }]
                });
            }
        });
        if (!items.length) {
            const firstErr = settled.find(r => r.status === 'rejected');
            throw new Error((firstErr && firstErr.reason && firstErr.reason.message) ? firstErr.reason.message : '全部生成失败，请重试');
        }

        lastItems = items;
        showResults();
    } catch (err) {
        console.error(err); showView('x'); $('errTxt').textContent = err.message || '请稍后重试';
    } finally { busy = false; updateGenBtn(); }
}

// 换一批道具：跳过分析，直接重抽 N 套
async function regenerateProps() {
    if (busy) return;
    await runShots();
}

// 重出某一张（当前角度，原样再画一次）
async function regenerateOne(idx) {
    if (busy) return;
    const it = lastItems[idx];
    if (!it) return;
    const v = it.views[it.active];
    if (!v) return;
    busy = true;
    const card = document.querySelector('[data-idx="' + idx + '"]');
    if (card) card.style.opacity = '.35';
    try {
        const src = await generateSceneImage(promptForView(it, v), v.refImage);
        v.src = src;
        showResults();
    } catch (e) {
        alert('重出失败：' + (e.message || '请稍后重试'));
        if (card) card.style.opacity = '1';
    } finally { busy = false; }
}

// 提交微调指令：把框里的话拼进这张图的提示词，只重出这一张
async function submitTune(idx) {
    if (busy) return;
    const it = lastItems[idx];
    if (!it) return;
    const v = it.views[it.active];
    const box = document.querySelector('[data-tune="' + idx + '"]');
    if (!v || !box) return;
    const t = box.value.trim();
    if (!t) { alert('先写一句想改什么，比如「不要分子结构」或「红色改成浅蓝」'); return; }
    v.tune = t;
    busy = true;
    const card = document.querySelector('[data-idx="' + idx + '"]');
    if (card) card.style.opacity = '.35';
    try {
        const sceneRef = await toSceneRef(v.src);
        const prodRef = await resizeForAPI(productCroppedSrc, 1024);
        const tuned = withTuneLocked(buildScenePrompt(sceneProduct, sceneTone, sceneAccent, curPack, it.set), v.tune);
        const src = await generateSceneImage(tuned, [prodRef, sceneRef]);
        v.src = src;
        showResults();
    } catch (e) {
        alert('微调失败：' + (e.message || '请稍后重试'));
        if (card) card.style.opacity = '1';
    } finally { busy = false; }
}

async function generate() {
    if (busy || !productCroppedSrc) return;
    if (!isLicensed() && freeLeft() <= 0) { openBuyDlg(); return; }
    busy = true; $('genBtn').disabled = true;
    try {
        showView('l');
        resetRunCost();
        setStep(1); $('ldgTxt').textContent = '正在分析产品与色调...'; $('ldgSub').textContent = '大约需要 5-10 秒';
        await analyzeImages();
        lastRefImage = await prepareRefImage(productCroppedSrc);
    } catch (err) {
        console.error(err); busy = false; updateGenBtn(); showView('x'); $('errTxt').textContent = err.message || '请稍后重试';
        return;
    }
    busy = false;
    await runShots();
    if (!isLicensed() && lastItems && lastItems.length > 0) {
        setFreeUsed(getFreeUsed() + 1);
        renderQuota();
    }
}

function showResults() {
    showView('r');
    const container = $('resContent');
    container.innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'res-grid';
    lastItems.forEach((it, idx) => {
        const v = it.views[it.active] || it.views[0];
        const card = document.createElement('div');
        card.className = 'res-card';
        card.setAttribute('data-idx', idx);

        card.innerHTML =
            '<div class="res-card-img"><img src="' + v.src + '" alt="场景图' + (idx + 1) + '"></div>' +
            '<div class="res-card-body">' +
            '<div class="set-name">' + it.name + '</div>' +
            '<div class="tune-row">' +
            '<textarea class="tune-box" data-tune="' + idx + '" placeholder="调颜色、明暗、虚化。比如：水的颜色加深 / 整体亮一点 / 背景再虚一点">' + (v.tune || '') + '</textarea>' +
            '<button class="tune-btn" onclick="submitTune(' + idx + ')">提交</button>' +
            '</div>' +
            '<div class="tune-hint">微调只改颜色 / 明暗 / 虚化；想换道具和摆放，点「重出这张」重新抽</div>' +
            '<div class="res-links">' +
            '<a href="' + v.src + '" download="scene-' + (idx + 1) + '.jpg">下载</a>' +
            '<a onclick="regenerateOne(' + idx + ')">重出这张</a>' +
            '</div>' +
            '</div>';
        grid.appendChild(card);
    });
    container.appendChild(grid);
}

function showView(v) {
    $('vEmpty').style.display = v === 'e' ? 'flex' : 'none';
    $('vLoad').style.display = v === 'l' ? 'flex' : 'none';
    $('vRes').style.display = v === 'r' ? 'block' : 'none';
    $('vErr').style.display = v === 'x' ? 'block' : 'none';
}

function resetAll() {
    clearPd();
    sceneProduct = ''; sceneTone = ''; sceneAccent = '';
    lastRefImage = null; lastItems = [];
    showView('e');
}

document.addEventListener('DOMContentLoaded', () => {
    showView('e'); pickRatio('1:1'); pickSize('medium'); loadCostStat(); updateGenBtn(); renderQuota();
});

    (function () {
        function stop(e) { e.preventDefault(); }
        window.addEventListener('dragenter', stop, false);
        window.addEventListener('dragover', stop, false);
        window.addEventListener('drop', stop, false);
        window.addEventListener('drop', function (e) {
            var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
            if (!f || String(f.type).indexOf('image') !== 0) return;
            var t = e.target;
            if (t && t.closest && t.closest('#drop')) return;
            var fn = window[''];
            if (typeof fn === 'function') fn(f);
        }, false);
    })();
</script>
